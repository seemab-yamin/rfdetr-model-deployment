# RF-DETR Nano (COCO) detection service. Setup guide: docs/first-time-setup.md

model:
  path: models/rf-detr-nano.onnx      # must be under models/ so the image includes it
  url: https://huggingface.co/PierreMarieCurie/rf-detr-onnx/resolve/main/rf-detr-nano.onnx  # direct link. CI downloads it to path. Remove if you add the file yourself
  task: detection
  input_size: [384, 384]       # height, width. Used only if the model input is dynamic
  channel_order: RGB           # RGB or BGR
  normalize: true              # true divides pixel values by 255
  mean: [0.485, 0.456, 0.406]  # ImageNet mean, subtracted after normalize
  std: [0.229, 0.224, 0.225]   # ImageNet std, divided after mean
  # class names in model order. RF-DETR COCO outputs 91 logits indexed by COCO category id, so unused ids are N/A
  labels: [__background__, person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire hydrant, N/A, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, N/A, backpack, umbrella, N/A, N/A, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, N/A, wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch, potted plant, bed, N/A, dining table, N/A, N/A, toilet, N/A, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, N/A, book, clock, vase, scissors, teddy bear, hair drier, toothbrush]

inference:
  # CUDA first; ONNX Runtime falls back to CPU when no GPU is visible. /health shows the active ones.
  # Local CPU dev: set INFERENCE_PROVIDERS=CPUExecutionProvider instead of editing this.
  providers: [CUDAExecutionProvider, CPUExecutionProvider]
  confidence_threshold: 0.5    # RF-DETR reference default
  max_upload_mb: 10            # /predict rejects larger uploads with 413
